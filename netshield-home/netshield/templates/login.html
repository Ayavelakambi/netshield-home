{% extends "base.html" %}
{% block title %}Sign in — NetShield Home{% endblock %}
{% block bodyclass %}login-page{% endblock %}
{% block standalone %}
<div class="login-card">
  <div class="login-brand"><span class="brand-mark">&#128737;</span> NetShield <span class="brand-sub">Home</span></div>
  <p class="login-sub">Self-hosted network security &amp; parental control</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary block" type="submit">Sign in</button>
  </form>
  <p class="login-foot">Runs entirely on your LAN — no cloud services required.</p>
</div>
{% endblock %}
